set -g prefix ^A

set -g history-limit 200000
set -g mouse yes
set -g default-terminal "xterm-256color"
set -g terminal-overrides ',xterm-256color:Tc'
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g extended-keys on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Catppuccin Macchiato with a Powerline-style status bar.
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_current_number_color '#b7bdf8'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_connect_separator 'yes'

# Load the theme before using its status modules.
run '~/.tmux/plugins/tmux/catppuccin.tmux'
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_application}#{E:@catppuccin_status_date_time}'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
# Initialize TMUX plugin manager (must remain at bottom of config )
run '~/.tmux/plugins/tpm/tpm'
